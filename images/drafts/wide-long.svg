<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d">
<title id="t">Wide and long layouts of the same plant measurements</title>
<desc id="d">Left, a wide table: one row per plant, with heights on day 1, day 8 and day 15 in separate columns. Right, the same data as a long table: one row per plant per day, with a Day column and a Height column. Colors link each day column in the wide table to its rows in the long table.</desc>
