<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
<title id="t">A pivot table groups rows and summarizes each group</title>
<desc id="d">Left, eight rows of data with an age group and leisure minutes for each person, colored by age group. Right, the pivot table: one row per age group, with the number of people and their average leisure. 25-34: 3 people, average 160 minutes. 35-44: 2 people, average 120. 65+: 3 people, average 360.</desc>
<rect width="960" height="470" fill="#ffffff"/>
<text x="40" y="62" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">The data</text>
<text x="40" y="88" font-size="15" font-weight="400" fill="#475569" text-anchor="start" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">one row per person</text>
<rect x="40" y="120" width="130" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="105.0" y="143" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">Age group</text>
<rect x="170" y="120" width="150" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="245.0" y="143" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">Leisure (min)</text>
