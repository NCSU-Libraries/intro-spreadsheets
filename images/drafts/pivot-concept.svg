<rect x="40" y="188" width="130" height="34" fill="#ede9fe" stroke="#cbd5e1" stroke-width="1"/>
<text x="105.0" y="211" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">65+</text>
